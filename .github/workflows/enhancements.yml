name: Temporal experiment checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/temporal_enhancements/requirements.txt
      - run: python -m pip install -r experiments/temporal_enhancements/requirements.txt
      - run: python -m unittest discover -s tests -v
