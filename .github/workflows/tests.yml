name: Reproduce and test
on: [push, pull_request]
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python train_models.py --output-dir artifacts
      - run: python -m unittest discover -s tests -v
      - run: python predict.py --input examples/prepared_crashes.csv --output /tmp/predictions.csv
      - run: python scenario.py --input examples/scenario.json
